<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML5</title>
  </head>
  <body>
    <h1>PRAXIS HTML5</h1>

    <h2>Formularios:</h2>
    
    <form>
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" />

      <br /><br />

      <label for="email">email:</label>
      <input type="email" id="email" name="email" />

      <br /><br />

      <label for="password">contrasena:</label>
      <input type="password" id="password" name="password" />

      <br /><br />

      <label for="numero">numero:</label>
      <input type="number" id="numero" name="numero" />

      <br /><br />

      <label for="telefono">Teléfono:</label>
      <input type="tel" id="telefono" name="telefono" />

      <br /><br />

      <input type="button" value="Botón" />

      <br /><br />

      <label for="archivo">Subir archivo:</label>
      <input type="file" id="archivo" name="archivo" />

      <br /><br />

      <label for="color">Color favorito:</label>
      <input type="color" id="color" name="color" />

      <br /><br />

      <label for="nivel">rango:</label>
      <input type="range" id="nivel" name="nivel" min="0" max="100" />

      <br /><br />

      <input type="submit" value="Enviar" />

      <br /><br />

      <input type="reset" value="Limpiar" />

      <br /><br />

      <label for="fecha">Fecha de nacimiento:</label>
      <input type="date" id="fecha" name="fecha" />

      <br /><br />

      <label for="hora">Hora:</label>
      <input type="time" id="hora" name="hora" />

      <br /><br />

      <p>Lenguajes que conoces:</p>
      
      <input type="checkbox" id="html" name="lenguaje" value="html" />
      <label for="html"> HTML </label>
      <input type="checkbox" id="css" name="lenguaje" value="css" />
      <label for="css"> CSS </label>
      <input type="checkbox" id="javascript" name="lenguaje" value="javascript"/>
      <label for="javascript"> JavaScript </label>

      <br /><br />

      <p>Sexo:</p>
      <input type="radio" id="masculino" name="sexo" value="masculino" />
      <label for="masculino">Masculino</label>
      <input type="radio" id="femenino" name="sexo" value="femenino" />
      <label for="femenino">Femenino</label>
    </form>

    <br /><br />

    <a href="../index.html">Volver a la pagnina principal</a>
    
  </body>
</html>
