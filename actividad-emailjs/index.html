<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar mensaje</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Enviar un mensaje</h1>
    <p>Completa el formulario para enviarte un correo de confirmación.</p>

    <form id="email-form">
      <label for="name">Nombre</label>
      <input id="name" name="name" type="text" required maxlength="100">

      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" required maxlength="254">

      <label for="title">Asunto</label>
      <input id="title" name="title" type="text" required maxlength="100">

      <label for="message">Mensaje</label>
      <textarea id="message" name="message" required maxlength="2000"></textarea>

      <button id="send-button" type="submit">Enviar mensaje</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
